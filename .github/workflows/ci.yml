name: ci

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libglew-dev libglfw3-dev zlib1g-dev xvfb libgl1-mesa-dri
      - name: build
        run: make -j4 galactic_football soccer_sim
      - name: simulate 270 ai matches and check invariants
        run: make test
      - name: render a frame with software opengl
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./galactic_football --shot frame.png --seconds 25
      - uses: actions/upload-artifact@v4
        with:
          name: frame
          path: frame.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install glew glfw
      - run: make -j4 galactic_football soccer_sim && make test
